[profile.default]
src = "contracts"
test = "contracts"
script = "script"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
bracket_spacing = true
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = false
